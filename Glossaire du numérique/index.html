<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossaire du numérique - Castelnau</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #094D70;
      --accent: #60b2c8;
      --white: #ffffff;
      --main-align: 80px;
      --font-scale: 1;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
    }

    body {
      margin: 0;
      background: var(--bg-dark);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* --- HERO --- */
    .hero {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      scroll-snap-align: start;
      background: radial-gradient(circle at center, #0a2d4d 0%, var(--bg-dark) 70%);
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 900;
      margin-bottom: 40px;
      max-width: 1000px;
      line-height: 1.1;
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 18px 32px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary { background: var(--accent); color: var(--bg-dark); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--white); border: 1px solid rgba(255,255,255,0.2); }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

    /* --- HEADER --- */
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px var(--main-align);
      z-index: 100;
      background: linear-gradient(to bottom, rgba(9,77,112,0.97) 60%, transparent);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .header.visible { opacity: 1; pointer-events: auto; }

    .brand { display: flex; align-items: center; gap: 40px; }
    .logo-img { height: 50px; width: auto; display: block; }
    .brand-text { font-weight: 400; letter-spacing: 2px; font-size: 0.8rem; text-transform: uppercase; white-space: nowrap; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    /* --- FILTRES --- */
    .cat-filters { display: flex; gap: 8px; }
    .cat-wrap { position: relative; }
    .cat-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      color: rgba(255,255,255,0.75);
      font-size: 0.72rem;
      padding: 6px 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .cat-btn:hover { background: rgba(255,255,255,0.14); }
    .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #094D70; font-weight: 700; }

    .cat-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 200px;
      background: rgba(9,77,112,0.98);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 8px;
      z-index: 500;
      backdrop-filter: blur(20px);
    }
    .cat-wrap.open .cat-dropdown { display: block; }
    .cat-dropdown a { display: block; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,0.8); font-size: 0.8rem; text-decoration: none; }
    .cat-dropdown a:hover { background: rgba(96,178,200,0.15); color: var(--accent); }

    /* --- BARRE DE RECHERCHE AMÉLIORÉE --- */
    .search-wrapper {
      position: relative;
      width: 260px;      /* largeur fixe — ne bouge jamais */
      flex-shrink: 0;
    }

    .search-container {
      background: rgba(255,255,255,0.1);
      border-radius: 50px;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid rgba(255,255,255,0.18);
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }
    .search-container:focus-within {
      border-color: var(--accent);
      background: rgba(96,178,200,0.08);
    }
    .search-container input {
      background: transparent;
      border: none;
      color: white;
      outline: none;
      width: 0;          /* laisse flex gérer */
      flex: 1;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      min-width: 0;
    }
    .search-container input::placeholder { color: rgba(255,255,255,0.4); }

    .search-suggestions {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;          /* ancré à droite du wrapper */
      left: auto;
      width: 320px;      /* largeur fixe indépendante */
      background: rgba(9,77,112,0.98);
      border: 1px solid rgba(96,178,200,0.3);
      border-radius: 16px;
      overflow: hidden;
      z-index: 600;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      max-height: 340px;
      overflow-y: auto;
    }
    .search-suggestions.open { display: block; }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover, .suggestion-item.highlighted { background: rgba(96,178,200,0.15); }
    .suggestion-icon { font-size: 1.3rem; width: 28px; text-align: center; flex: 0 0 28px; }
    .suggestion-text { flex: 1; }
    .suggestion-word { font-size: 0.9rem; font-weight: 700; color: var(--white); }
    .suggestion-cat { font-size: 0.7rem; color: var(--accent); margin-top: 2px; opacity: 0.8; }
    .suggestion-match { color: var(--accent); }

    .search-empty {
      padding: 20px 16px;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      text-align: center;
    }

    /* --- BOUTON TAILLE TEXTE --- */
    .font-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      padding: 4px 6px;
    }
    .font-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      border-radius: 50px;
      padding: 3px 9px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      transition: all 0.2s;
      line-height: 1;
    }
    .font-btn.active { background: var(--accent); color: #094D70; }
    .font-btn:first-child { font-size: 0.75rem; }
    .font-btn:last-child { font-size: 1rem; }

    /* --- SLIDES --- */
    .slide {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 110px var(--main-align) 60px;
      position: relative;
      overflow: hidden;
    }

    .slide-top {
      display: flex;
      flex-direction: column;
    }

    .category-tag {
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 2px;
      font-size: 0.85rem;
      margin-bottom: 28px;
      display: block;
    }

    /* ── BLOCS IMAGES ── */
    .blocs-row {
      display: flex;
      gap: 16px;
      flex-wrap: nowrap;
      align-items: flex-start;
    }

    .bloc {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .bloc-img-wrap:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba (96,178,200,0.35);
      transform: translateY(-4px);
    }

  .bloc-img-wrap {
  width: 100%;
  height: 48vh;
  border: 1.5px solid rgba(255,255,255,0.7);
  border-radius: 12px;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  transition: all 0.25s ease;
  padding: 20px;
}

.bloc-img-wrap img {
  display: block;
  width: clamp(180px, 60%, 320px);
  height: auto;
  object-fit: contain;
  transform: translateY(15px);
}

.bloc-img-wrap iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  position: relative;
  z-index: 1;
  background: #ffffff;
}

    .bloc-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0.15;
      user-select: none;
    }
    .bloc-placeholder svg { width: 32px; height: 32px; }
    .bloc-placeholder span {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--white);
      font-weight: 400;
    }

    /* ── LABEL INTÉRIEUR (en bas du bloc) ── */
    .bloc-label {
  position: absolute;
  left: 16px;
  top: 16px;
  right: 16px;
  bottom: auto;
  padding: 0;
  font-weight: 700;
  font-size: clamp(0.75rem, 1vw, 0.95rem);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  line-height: 1.3;
  color: var(--white);
  pointer-events: none;
  z-index: 2;
}

.bloc-sub {
  display: block;
  margin-top: 8px;
  position: static;
  font-size: clamp(0.8rem, 0.9vw, 0.95rem);
  color: #ffffff;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: none;
  line-height: 1.4;
  pointer-events: none;
}


.bloc-text-panel {
  width: 100%;
  height: 100%;
  padding: 28px 26px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: flex-start;
  color: var(--white);
}

.bloc-text-panel h3 {
  margin: 0 0 16px;
  font-size: clamp(1rem, 1.2vw, 1.15rem);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.bloc-text-panel ul {
  margin: 0;
  padding-left: 22px;
  display: grid;
  gap: 12px;
}

.bloc-text-panel li {
  font-size: clamp(0.9rem, 0.95vw, 1rem);
  line-height: 1.5;
  color: rgba(255,255,255,0.92);
}


    /* ── VIDÉO GLISSER-DÉPOSER ── */
    .bloc:has(.drag-video-demo) .bloc-img-wrap {
      background: #ffffff;
      border-color: rgba(255,255,255,0.9);
    }

    .bloc:has(.drag-video-demo) .bloc-img-wrap:hover {
      background: #ffffff;
      border-color: var(--accent);
    }

    .bloc:has(.drag-video-demo) .bloc-label,
    .bloc:has(.drag-video-demo) .bloc-sub {
      color: #094D70;
    }

    .drag-video-demo {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .drag-video-demo video {
      width: 70%;
      height: auto;
      max-height: 90%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      background: #ffffff;
      border-radius: 12px;
    }


    /* ── DÉMO GLISSER-DÉPOSER (ancien système conservé mais non utilisé) ── */
    .drag-demo-pc {
      position: relative;
      width: min(88%, 430px);
      height: min(62%, 250px);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015)),
        rgba(0,0,0,0.08);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .drag-window-bar {
      height: 40px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: rgba(255,255,255,0.03);
    }

    .drag-window-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }

    .drag-window-title {
      margin-left: 8px;
      font-size: 0.76rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.03em;
    }

    .drag-window-body {
      position: relative;
      height: calc(100% - 40px);
    }

    .drag-file-ghost,
    .drag-file,
    .drag-folder,
    .drag-cursor {
      position: absolute;
    }

    .drag-file-ghost {
      left: 58px;
      top: 92px;
      width: 74px;
      height: 94px;
      border: 2px dashed rgba(255,255,255,0.16);
      border-radius: 16px;
      opacity: 0;
      transition: opacity 0.28s ease;
    }

    .bloc-img-wrap:hover .drag-file-ghost {
      opacity: 1;
    }

    .drag-file {
      left: 58px;
      top: 92px;
      width: 74px;
      height: 94px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      transition: transform 0.62s cubic-bezier(.22,.8,.2,1), filter 0.35s ease;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.18));
    }

    .bloc-img-wrap:hover .drag-file {
      transform: translate(172px, -20px) scale(1.06);
      filter: drop-shadow(0 18px 28px rgba(0,0,0,0.28));
    }

    .drag-folder {
      right: 52px;
      top: 86px;
      width: 106px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.38s ease, filter 0.38s ease;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.12));
    }

    .bloc-img-wrap:hover .drag-folder {
      transform: scale(1.03);
      filter: drop-shadow(0 0 12px rgba(96,178,200,0.18));
    }

    .drag-cursor {
      left: 86px;
      top: 146px;
      width: 32px;
      height: 42px;
      z-index: 4;
      transition:
        transform 0.62s cubic-bezier(.22,.8,.2,1),
        left 0.62s cubic-bezier(.22,.8,.2,1),
        top 0.62s cubic-bezier(.22,.8,.2,1),
        filter 0.35s ease;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.24));
    }

    .bloc-img-wrap:hover .drag-cursor {
      left: 258px;
      top: 122px;
      transform: rotate(-8deg);
      filter: drop-shadow(0 8px 14px rgba(0,0,0,0.28));
    }

    .drag-caption-left,
    .drag-caption-right {
      position: absolute;
      bottom: 14px;
      font-size: 0.76rem;
      color: rgba(255,255,255,0.54);
      letter-spacing: 0.02em;
    }

    .drag-caption-left { left: 18px; }
    .drag-caption-right { right: 18px; }


    /* ── GRAND TITRE — typographie suisse, ancré en bas à gauche ── */
    .big-title {
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.82;
      margin: 0;
      letter-spacing: -0.02em;
      align-self: end;
      justify-self: start;
      white-space: nowrap;
      /* font-size injecté par JS selon longueur du mot */
    }


    /* --- SECTION CLAVIER EMBARQUÉ --- */
    .keyboard-section, .souris-section{
  height: 100vh;
  width: 100vw;
  scroll-snap-align: start;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 110px var(--main-align) 60px;
  background: radial-gradient(circle at center, #0a2d4d 0%, var(--bg-dark) 78%);
}

/* Glisser section — explorateur avec titre en bas, largeur réduite */
.glisser-section {
  height: 100vh;
  width: 100vw;
  scroll-snap-align: start;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 90px var(--main-align) 60px;
  background: radial-gradient(circle at center, #0a2d4d 0%, var(--bg-dark) 78%);
}

.glisser-section .keyboard-embed-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: stretch;
}

.glisser-section .keyboard-embed-frame {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  border-radius: 12px;
}

/* ── PHISHING SECTION ── */
.phishing-section {
  height: 100vh;
  width: 100vw;
  scroll-snap-align: start;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 90px var(--main-align) 60px;
  background: radial-gradient(circle at center, #0a2d4d 0%, var(--bg-dark) 78%);
}

.phishing-section .keyboard-embed-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: stretch;
}

.phishing-section .keyboard-embed-frame {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  border-radius: 12px;
}

/* ── RECHERCHE SECTION ── */
.recherche-section {
  height: 100vh;
  width: 100vw;
  scroll-snap-align: start;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 90px var(--main-align) 60px;
  background: radial-gradient(circle at center, #0a2d4d 0%, var(--bg-dark) 78%);
}

.recherche-section .keyboard-embed-wrap {
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  align-items: stretch;
}

.recherche-section .keyboard-embed-frame {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  border-radius: 12px;
}

/* ── COOKIE SECTION ── */
.cookie-section {
  height: 100vh;
  width: 100vw;
  scroll-snap-align: start;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 90px var(--main-align) 60px;
  background: radial-gradient(circle at center, #0a2d4d 0%, var(--bg-dark) 78%);
}
.cookie-section .keyboard-embed-wrap {
  width: 100%; height: 100%;
  overflow: hidden; display: flex; align-items: stretch;
}
.cookie-section .keyboard-embed-frame {
  width: 100%; height: 100%;
  border: 0; display: block; border-radius: 12px;
}
.souris-section {
  padding: 0;
  display: block;
}

.souris-section .keyboard-embed-wrap {
  position: absolute;
  top: 80px;
  left: 0;
  right: 0;
  bottom: 0;
  display: block;
  padding: 0;
}

.souris-section .keyboard-embed-frame {
  width: 100%;
  height: calc(100vh - 80px);
  display: block;
}

.keyboard-embed-wrap{
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  border: none;
  box-shadow: none;
  backdrop-filter: none;
  display: flex;
  align-items: center;
}

    .keyboard-embed-frame{
      width: 100%;
      height: 90%;
      border: 0;
      display: block;
      background: transparent;
    }

    .keyboard-embed-title{
      font-weight: 900;
      text-transform: uppercase;
      line-height: 0.82;
      margin: 0;
      letter-spacing: -0.02em;
      white-space: nowrap;
      align-self: end;
      justify-self: start;
      color: var(--white);
      /* font-size injecté par JS */
    }



    .key-tooltip{
      position: absolute;
      left: 80px;
      bottom: 120px;
      width: 320px;
      padding: 22px;
      border-radius: 14px;
      background: rgba(9,77,112,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      transition: all .25s ease;
      pointer-events: none;
      z-index: 5;
    }

    .key-tooltip.visible{
      opacity: 1;
      transform: translateY(0);
    }

    .key-tooltip h3{
      margin: 0 0 6px 0;
      font-size: 18px;
      color: #60b2c8;
    }

    .key-tooltip p{
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
      color: #d8e2ee;
    }

    /* --- COMPTEUR --- */
    .slide-counter { position: fixed; bottom: 30px; right: var(--main-align); font-size: 0.8rem; color: rgba(255,255,255,0.4); z-index: 100; }

    @media (max-width: 1024px) {
      :root { --main-align: 40px; }
      .cat-filters { display: none; }
      .blocs-row { gap: 10px; flex-wrap: wrap; }
      .bloc-img-wrap { height: 30vh; }
    }
  </style>
</head>
<body>

<section class="hero" id="accueil">
  <h1>BIENVENUE DANS LE GLOSSAIRE DU NUMÉRIQUE !</h1>
  <div class="hero-buttons">
    <button class="btn btn-primary" onclick="startGlossary()">Démarrer</button>
    <a href="conseiller_numerique_plaquette_presentation.pdf" target="_blank" class="btn btn-secondary">
      Vous êtes en difficulté ? Prenez rendez-vous avec un conseiller numérique
    </a>
  </div>
</section>

<section class="souris-section" id="sourisMemo">
  <div class="keyboard-embed-wrap">
    <iframe
      class="keyboard-embed-frame"
      src="souris.html"
      title="Souris interactive"
      loading="lazy">
    </iframe>

// ─── UTILITAIRES ──────────────────────────────────────────────────────────────
function slugify(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,""); }
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function fuzzyMatch(query, target) {
  const q = norm(query);
  const t = norm(target);
  if (t.startsWith(q)) return { match: true, score: 3 };
  if (t.includes(q))  return { match: true, score: 2 };
  const words = q.split(/\s+/);
  if (words.every(w => t.includes(w))) return { match: true, score: 1 };
  return { match: false, score: -1 };
}

function fitTitles() {
  const availableWidth = window.innerWidth - 2 * parseInt(getComputedStyle(document.documentElement).getPropertyValue('--main-align'));
  document.querySelectorAll('.big-title').forEach(el => {
    // Part d'une taille max et réduit jusqu'à ce que ça tienne
    let size = Math.min(window.innerWidth * 0.12, 112); // max ~7rem à 1600px
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > availableWidth && size > 28) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  });
}
fitTitles();

function applyFilter(catKey) {
  document.querySelectorAll('.cat-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cats.find(x => x.key === catKey).label);
  });
  document.querySelectorAll('.slide').forEach(s => {
    s.style.display = (catKey === 'all' || s.dataset.cat === catKey) ? 'grid' : 'none';
  });
  updateCounter();
}

// ─── COMPTEUR ─────────────────────────────────────────────────────────────────
let currentObserver = null;
function updateCounter() {
  const visible = [...document.querySelectorAll('.slide')].filter(s => s.style.display !== 'none');
  if (currentObserver) currentObserver.disconnect();
  currentObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const idx = visible.indexOf(e.target) + 1;
        document.getElementById('counter').textContent = `${idx} / ${visible.length}`;
      }
    });
  }, { threshold: 0.6 });
  visible.forEach(s => currentObserver.observe(s));
}
updateCounter();

// ─── RECHERCHE AVEC SUGGESTIONS EN TEMPS RÉEL ─────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchSuggs = document.getElementById('searchSuggestions');
const searchClear = document.getElementById('searchClear');

let highlightIdx  = -1;
let currentSuggs  = [];

function getSuggestions(q) {
  if (!q || q.length < 1) return [];
  return glossaire
    .map(item => ({ item, ...fuzzyMatch(q, item.t) }))
    .filter(r => r.match)
    .sort((a, b) => b.score - a.score)
    .slice(0, 8);
}

function highlightText(text, query) {
  const q = norm(query);
  const t = norm(text);
  const idx = t.indexOf(q);
  if (idx === -1) return text;
  return text.slice(0, idx) +
    `<span class="suggestion-match">${text.slice(idx, idx + query.length)}</span>` +
    text.slice(idx + query.length);
}

function renderSuggestions(q) {
  currentSuggs = getSuggestions(q);
  highlightIdx = -1;

  if (!q) {
    searchSuggs.classList.remove('open');
    return;
  }

  if (currentSuggs.length === 0) {
    searchSuggs.innerHTML = `<div class="search-empty">Aucun résultat pour « ${q} »</div>`;
    searchSuggs.classList.add('open');
    return;
  }

  searchSuggs.innerHTML = currentSuggs.map((r, i) => `
    <div class="suggestion-item" data-idx="${i}">
      <span class="suggestion-icon">${r.item.i}</span>
      <div class="suggestion-text">
        <div class="suggestion-word">${highlightText(r.item.t, q)}</div>
        <div class="suggestion-cat">${r.item.catLabel}</div>
      </div>
    </div>
  `).join('');

  searchSuggs.querySelectorAll('.suggestion-item').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectSuggestion(parseInt(el.dataset.idx));
    });
  });

  searchSuggs.classList.add('open');
}

function selectSuggestion(idx) {
  const r = currentSuggs[idx];
  if (!r) return;
  searchInput.value = r.item.t;
  searchSuggs.classList.remove('open');
  searchClear.style.display = 'block';
  applyFilter('all');
  setTimeout(() => {
    document.getElementById(slugify(r.item.t)).scrollIntoView({behavior:'smooth'});
  }, 50);
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  renderSuggestions(q);
});

searchInput.addEventListener('keydown', (e) => {
  const items = searchSuggs.querySelectorAll('.suggestion-item');
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightIdx = Math.min(highlightIdx + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightIdx));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightIdx = Math.max(highlightIdx - 1, 0);
    items.forEach((el, i) => el.classList.toggle('highlighted', i === highlightIdx));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (highlightIdx >= 0) selectSuggestion(highlightIdx);
    else if (currentSuggs.length > 0) selectSuggestion(0);
  } else if (e.key === 'Escape') {
    searchSuggs.classList.remove('open');
  }
});

searchInput.addEventListener('focus', () => {
  if (searchInput.value.trim()) renderSuggestions(searchInput.value.trim());
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => searchSuggs.classList.remove('open'), 150);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  searchSuggs.classList.remove('open');
  searchInput.focus();
});

document.getElementById('searchForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (currentSuggs.length > 0) selectSuggestion(highlightIdx >= 0 ? highlightIdx : 0);
});

// ─── TAILLE DU TEXTE ──────────────────────────────────────────────────────────
function setFontScale(scale) {
  document.documentElement.style.setProperty('--font-scale', scale);
  document.getElementById('fontSmall').classList.toggle('active', scale === 1);
  document.getElementById('fontLarge').classList.toggle('active', scale === 1.25);
}





// ─── DIVERS ───────────────────────────────────────────────────────────────────
function startGlossary() {
  document.getElementById('sourisMemo').scrollIntoView({behavior:'smooth'});
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.cat-wrap')) document.querySelectorAll('.cat-wrap').forEach(w => w.classList.remove('open'));
  if (!e.target.closest('#searchWrapper')) searchSuggs.classList.remove('open');
});

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "keyboard-memo") return;

  const tooltip = document.getElementById("keyTooltip");
  const tooltipTitle = document.getElementById("tooltipTitle");
  const tooltipText = document.getElementById("tooltipText");

  if (!tooltip || !tooltipTitle || !tooltipText) return;

  if (event.data.action === "show") {
    tooltipTitle.textContent = event.data.title || "";
    tooltipText.textContent = event.data.text || "";
    tooltip.classList.add("visible");
  }

  if (event.data.action === "hide") {
    tooltip.classList.remove("visible");
  }
});

// ─── RELAY CLAVIER → IFRAME via postMessage ─────────────────────────────────
(function () {
  const section = document.getElementById('clavierMemo');
  const frame   = document.querySelector('#clavierMemo .keyboard-embed-frame');
  if (!frame || !section) return;

  function isKeyboardVisible() {
    const rect = section.getBoundingClientRect();
    return rect.top < window.innerHeight && rect.bottom > 0;
  }

  const scrollKeys = new Set([
    'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
    'PageUp', 'PageDown', 'Home', 'End', 'Space'
  ]);

  function isInteractiveTarget(target) {
    return target instanceof Element &&
      !!target.closest('input, textarea, select, button, a[href], [contenteditable="true"], [tabindex]:not([tabindex="-1"])');
  }

  function shouldPreventKeyboardDefault(e) {
    if (e.defaultPrevented || e.key === 'Tab' || isInteractiveTarget(e.target)) return false;
    if (e.ctrlKey || e.metaKey || (e.altKey && e.code !== 'AltRight')) return false;
    return scrollKeys.has(e.code);
  }

  function relay(type, e) {
    if (!isKeyboardVisible()) return;

    if (type === 'keydown' && shouldPreventKeyboardDefault(e)) {
      e.preventDefault();
    }

    frame.contentWindow.postMessage({
      type: 'key-relay',
      eventType: type,
      key:      e.key,
      code:     e.code,
      keyCode:  e.keyCode,
      ctrlKey:  e.ctrlKey,
      altKey:   e.altKey,
      metaKey:  e.metaKey,
      shiftKey: e.shiftKey,
      repeat:   e.repeat,
    }, '*');
  }

  document.addEventListener('keydown', (e) => {
    if (document.activeElement === searchInput) return;
    relay('keydown', e);
  }, { capture: true });
  document.addEventListener('keyup', (e) => {
    if (document.activeElement === searchInput) return;
    relay('keyup', e);
  }, { capture: true });
})();
</script>
