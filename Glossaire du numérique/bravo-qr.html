<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bravo QR code</title>
  <style>
    :root {
      --bg-dark: #061d33;
      --accent: #60b2c8;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg-dark);
      color: var(--white);
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 700px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 32px 24px;
      background: #0a2d4d;
      text-align: center;
    }

    .emoji {
      font-size: 56px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.1;
      font-weight: 900;
      text-transform: uppercase;
    }

    p {
      margin: 0 auto 28px;
      max-width: 520px;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .back-link {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #061d33;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">✅</div>
    <h1>Bravo, vous savez scanner un QR code !</h1>
    <p>Le scan a fonctionné. Vous avez bien ouvert une page à partir d’un QR code.</p>
    <a class="back-link" href="https://glossaire-du-numerique.netlify.app/#qr-code">
      ← Retour au glossaire
    </a>
  </main>
</body>
</html>
