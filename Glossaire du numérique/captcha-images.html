<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPTCHA – Sélection d'images</title>
  <link rel="icon" type="image/png" href="glossaire_favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --border: #dde3ec;
    --text: #1a2840;
    --text-muted: #7b8ba4;
    --accent: #60b2c8;
    --accent-dark: #094D70;
    --success: #3dba7a;
    --danger: #e05252;
    --rc-blue: #4a90d9;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text);
    overflow: hidden;
    display: flex;
    align-items: stretch;
  }

  .window {
    width: 100%;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .win-header {
    background: var(--accent-dark);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .win-header-title {
    font-size: 0.88rem;
    font-weight: 600;
    color: #fff;
  }

  .win-close {
    color: rgba(255,255,255,0.45);
    font-size: 1rem;
    cursor: default;
  }

  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    overflow: hidden;
  }

  .rc-card {
    width: 100%;
    max-width: 316px;
    max-height: 100%;
    border: 1px solid #d3d3d3;
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .rc-header {
    background: var(--rc-blue);
    padding: 8px 12px 7px;
    color: white;
    flex-shrink: 0;
  }

  .rc-header-small {
    font-size: 0.65rem;
    opacity: 0.92;
    margin-bottom: 2px;
  }

  .rc-header-big {
    font-size: 0.9rem;
    font-weight: 700;
    line-height: 1.15;
  }

  .rc-header-skip {
    font-size: 0.58rem;
    opacity: 0.8;
    margin-top: 2px;
  }

  .rc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    flex: 1 1 auto;
    min-height: 0;
    aspect-ratio: 1 / 1;
    border-top: 2px solid #ccc;
    border-bottom: 2px solid #ccc;
    background: #d8d8d8;
  }

  .rc-cell {
    aspect-ratio: 1;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    outline: 1.5px solid white;
    background: #d8d8d8;
  }

  .rc-cell.loading {
    animation: shimmer 1.2s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { background: #d0d0d0; }
    50% { background: #e8e8e8; }
  }

  .rc-cell canvas {
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .sel-overlay {
    position: absolute;
    inset: 0;
    background: rgba(30, 90, 200, 0.40);
    opacity: 0;
    transition: opacity 0.12s;
    pointer-events: none;
  }

  .rc-cell.selected .sel-overlay {
    opacity: 1;
  }

  .sel-check {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--rc-blue);
    border: 2.5px solid white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    color: white;
    font-weight: 700;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  .rc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    background: #f9f9f9;
    border-top: 1px solid #e8e8e8;
    flex-shrink: 0;
  }

  .rc-footer-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rc-refresh {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    color: #666;
    transition: transform 0.3s;
    padding: 2px;
  }

  .rc-refresh:hover {
    transform: rotate(90deg);
    color: #333;
  }

  .rc-branding {
    font-size: 0.5rem;
    color: #aaa;
    line-height: 1.5;
  }

  .rc-branding b {
    color: #777;
    font-size: 0.55rem;
  }

  .rc-verify {
    background: var(--rc-blue);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 3px;
    font-size: 0.74rem;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
  }

  .rc-verify:hover {
    background: #3a7bc8;
  }

  .rc-result {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    padding: 24px 16px;
  }

  .rc-result.show {
    display: flex;
  }

  .result-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    color: white;
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
  }

  .result-icon.ok {
    background: var(--success);
    box-shadow: 0 4px 18px rgba(61,186,122,0.35);
  }

  .result-icon.error {
    background: var(--danger);
    box-shadow: 0 4px 18px rgba(224,82,82,0.35);
  }

  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .result-title {
    font-size: 0.92rem;
    font-weight: 700;
  }

  .result-sub {
    font-size: 0.74rem;
    color: var(--text-muted);
  }

  .rc-retry {
    background: none;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    padding: 7px 20px;
    border-radius: 50px;
    font-size: 0.73rem;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .rc-retry:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="window">
  <div class="win-header">
    <span class="win-header-title">🖼️ Sélection d'images</span>
    <span class="win-close">✕</span>
  </div>

  <div class="body">
    <div class="rc-card" id="rcCard">
      <div class="rc-header">
        <div class="rc-header-small">Sélectionnez toutes les images contenant</div>
        <div class="rc-header-big" id="rcLabel">des voitures</div>
        <div class="rc-header-skip">Cliquez sur toutes les cases où l'élément apparaît</div>
      </div>

      <div class="rc-grid" id="rcGrid"></div>

      <div class="rc-footer">
        <div class="rc-footer-left">
          <button class="rc-refresh" onclick="newChallenge()" title="Nouveau défi">↻</button>
          <div class="rc-branding"><b>reCAPTCHA</b><br>Confidentialité · Conditions</div>
        </div>
        <button class="rc-verify" onclick="verify()">VÉRIFIER</button>
      </div>
    </div>

    <div class="rc-result" id="rcResult">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-sub" id="resultSub"></div>
      <button class="rc-retry" onclick="newChallenge()">↩ Nouveau défi</button>
    </div>
  </div>
</div>

<script>
const CHALLENGES = [
  {
    label: 'des vélos',
    url: 'bike_captcha.png',
    correct: new Set([
      4, 5, 6, 7, 
      8, 9, 10, 11, 
      12
    ])
  },
  {
    label: 'des voitures',
    url: 'car_captcha.png',
    correct: new Set([
      5, 6, 7,
      8, 9, 10, 11
    ])
  },
  {
    label: 'des feux de circulation',
    url: 'traffic_light_captcha.png',
    correct: new Set([
      4, 5, 6
    ])
  }
];

let current = null;
let selected = new Set();
let ready = false;

function newChallenge() {
  document.getElementById('rcCard').style.display = '';
  document.getElementById('rcResult').classList.remove('show');
  selected.clear();
  ready = false;

  current = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
  document.getElementById('rcLabel').textContent = current.label;

  const grid = document.getElementById('rcGrid');
  grid.innerHTML = '';

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement('div');
    cell.className = 'rc-cell loading';
    cell.dataset.idx = i;
    grid.appendChild(cell);
  }

  const img = new Image();
  img.onload = () => {
    ready = true;
    renderCells(img);
  };
  img.onerror = () => {
    renderError();
  };
  img.src = current.url;
}

function renderCells(img) {
  const grid = document.getElementById('rcGrid');
  const cells = grid.querySelectorAll('.rc-cell');
  const cols = 4;
  const rows = 4;
  const gridW = grid.clientWidth || 312;
  const cellPx = Math.floor(gridW / cols);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  cells.forEach((cell, i) => {
    cell.classList.remove('loading');

    const col = i % cols;
    const row = Math.floor(i / cols);

    const canvas = document.createElement('canvas');
    canvas.width = cellPx * dpr;
    canvas.height = cellPx * dpr;
    canvas.style.width = cellPx + 'px';
    canvas.style.height = cellPx + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const srcCellW = img.naturalWidth / cols;
    const srcCellH = img.naturalHeight / rows;

    ctx.drawImage(
      img,
      col * srcCellW,
      row * srcCellH,
      srcCellW,
      srcCellH,
      0,
      0,
      cellPx,
      cellPx
    );

    const overlay = document.createElement('div');
    overlay.className = 'sel-overlay';
    overlay.innerHTML = '<div class="sel-check">✓</div>';

    cell.innerHTML = '';
    cell.appendChild(canvas);
    cell.appendChild(overlay);

    cell.onclick = () => toggleCell(cell, i);
  });
}

function renderError() {
  const grid = document.getElementById('rcGrid');
  grid.innerHTML = `
    <div style="
      grid-column: 1 / -1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
      font-size:0.8rem;
      color:#666;
      background:#f2f2f2;
    ">
      Impossible de charger l'image.<br>
      Vérifiez que le fichier est bien présent à côté de ce document.
    </div>
  `;
}

function toggleCell(cell, i) {
  if (selected.has(i)) {
    selected.delete(i);
    cell.classList.remove('selected');
  } else {
    selected.add(i);
    cell.classList.add('selected');
  }
}

function verify() {
  if (!ready) return;

  const ok =
    selected.size === current.correct.size &&
    [...selected].every(i => current.correct.has(i));

  document.getElementById('rcCard').style.display = 'none';

  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  icon.className = 'result-icon ' + (ok ? 'ok' : 'error');
  icon.textContent = ok ? '✓' : '✕';
  title.textContent = ok ? 'Sélection correcte !' : 'Sélection incorrecte';
  title.style.color = ok ? 'var(--text)' : 'var(--danger)';
  sub.textContent = ok
    ? 'Vous avez bien identifié toutes les bonnes cases.'
    : 'Certaines cases étaient manquantes ou incorrectes.';

  document.getElementById('rcResult').classList.add('show');
}

window.addEventListener('load', newChallenge);
</script>
</body>
</html>
